name: swarm check
description: Validate swarm.toml against the swarm.toml v0.1 invariants (I1-I10)
inputs:
  path:
    description: Path to swarm.toml or a directory containing it
    default: "."
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
    - shell: bash
      run: uvx --from "${{ github.action_path }}/.." swarm-check "${{ inputs.path }}"
