# expect: I2
# seed: three-role spawn cycle
[conformance]
required = "L3"

[swarm]
root = "a"
[roles.a]
permissions = { allow = ["Read(docs/**)", "Agent"] }
can_spawn = ["b"]
[roles.b]
permissions = { allow = ["Read(docs/**)", "Agent"] }
can_spawn = ["c"]
[roles.c]
permissions = { allow = ["Read(docs/**)", "Agent"] }
can_spawn = ["a"]
