# expect: I10
# seed: aggregation names an undeclared label
[conformance]
required = "L3"
[roles.lead]
permissions = { allow = ["Read(docs/**)", "Agent", "SendMessage"] }
can_spawn = ["worker"]
can_assign = ["worker"]
budget = { tokens = 1_000_000 }
[roles.worker]
permissions = { allow = ["Read(docs/**)", "SendMessage"] }
max_instances = 2
can_message = ["lead"]
budget = { tokens = 200_000 }
[[aggregation]]
labels = ["pii"]
merge_by = "lead"
