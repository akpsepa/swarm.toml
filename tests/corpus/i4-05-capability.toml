# expect: I4
# seed: pusher holds the action as a declared capability
[conformance]
required = "L3"

[roles.lead]
permissions = { allow = ["Read(src/**)", "Agent"] }
can_spawn = ["coder"]
can_assign = ["coder", "releaser"]
[roles.coder]
permissions = { allow = ["Read(src/**)"] }
[roles.releaser]
permissions = { allow = ["Read(src/**)"] }
capabilities = ["git.push.main"]
[delegation]
non_delegable = ["git.push.main"]
[actions]
"git.push.main" = ["mcp__git__push_main"]
