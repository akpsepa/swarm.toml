# expect: I10
# seed: collective action not in [actions]
[conformance]
required = "L3"
[roles.lead]
permissions = { allow = ["Read(docs/**)", "Agent", "SendMessage"] }
can_spawn = ["worker"]
can_assign = ["worker"]
budget = { tokens = 1_000_000 }
[roles.worker]
permissions = { allow = ["Read(docs/**)", "SendMessage"] }
max_instances = 2
can_message = ["lead"]
budget = { tokens = 200_000 }

[[collective]]
action = "report.publish"
requested_by = "worker"
requires_quorum = { of = "lead", min = 1 }
