name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest
  swarm-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [literature-review, pipeline, docs-bot]
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
        with:
          path: spec/examples/${{ matrix.example }}
