[swarm]
name = "aggregation-flat"

[conformance]
required = "L4"

[roles.analyst-a]
permissions = { allow = ["Read(data/orders/part-a.csv)", "SendMessage"] }
can_message = ["merger"]

[roles.analyst-b]
permissions = { allow = ["Read(data/orders/part-b.csv)", "SendMessage"] }
can_message = ["merger"]

[roles.merger]
permissions = { allow = ["Read(data/orders/**)", "SendMessage"] }
can_message = ["summarizer"]

[roles.summarizer]
permissions = { allow = ["Write(out/**)", "SendMessage"] }
can_message = ["merger"]

[labels]
orders = { paths = ["data/orders/**"] }

[[aggregation]]
labels = ["orders"]
merge_by = "merger"
