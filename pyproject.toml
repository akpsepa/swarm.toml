[project]
name = "swarm-toml"
version = "0.0.1"
description = "Reference implementation and research harness for swarm.toml"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6"]

[project.scripts]
swarm = "swarm_toml.check:main"
swarm-check = "swarm_toml.check:check_main"
swarm-hook = "swarm_toml.enforce.hook:main"
swarm-vote = "swarm_toml.enforce.vote_mcp:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Hand-written C3b hooks are experimental material, kept exactly as their writer produced them.
extend-exclude = ["harness/cases/*/c3b", "c3b/raw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
